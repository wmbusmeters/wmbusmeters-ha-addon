<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wmbusmeters HA addon configuration</title>
    <link href="{{ url_for('static', filename='bootstrap.min.css') }}" rel="stylesheet" media="all">
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
  </head>
  <body>
    <style>
      input:required:invalid {
        border-color: red;
      }
      /* Every meter is a card of its own, its name in the title. */
      .json-section {
        border: 1px solid #ced4da;
        border-radius: .5rem;
        padding: 0 1rem 1rem;
        margin-bottom: 1.5rem;
        background-color: #fbfcfd;
      }
      .json-section .meter-title {
        margin: 0 -1rem 1rem;
        padding: .5rem 1rem;
        border-bottom: 1px solid #ced4da;
        border-radius: .5rem .5rem 0 0;
        background-color: #e3f2fd;
        font-weight: 600;
      }
      /* Both MQTT rows share one label width, so the select and the
         checkbox start in the same place. */
      .mqtt-label {
        flex: 0 0 20rem;
        width: 20rem;
      }
      /* The panel actions of the manual MQTT discovery, framed and titled so
         that it is clear what they are about. */
      .json-section .meter-discovery-tools {
        border: 1px dashed #adb5bd;
        border-radius: .5rem;
        padding: .25rem .75rem .75rem;
        margin-bottom: 1rem;
        background-color: #fff;
      }
      .json-section .meter-discovery-tools legend {
        float: none;
        width: auto;
        padding: 0 .25rem;
        margin-bottom: .25rem;
        font-size: 1rem;
        font-weight: 600;
      }
      /* The names of a meter, the "MQTT discovery for this meter" row included,
         share one column width, so every "=" is in the same place. */
      .json-section .input-group > :first-child {
        flex: 0 0 35%;
        width: 35%;
      }
    </style>
    <div class="container">
      <nav style="background-color: #e3f2fd;">
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
          <img src="{{ url_for('static', filename='wmbusmeters.png') }}" width="40" height="40" class="d-inline-block align-top b-2" alt="">
          <a href="/" class="nav-link active" id="nav-home-tab" role="tab" aria-controls="nav-home" aria-selected="true">Home</a>
          <a href="/kem" class="nav-link" id="nav-kem-tab" role="tab" aria-controls="nav-kem" aria-selected="false">KEM processing</a>
          <a href="/drivers" class="nav-link" id="nav-driver-tab" role="tab" aria-controls="nav-driver" aria-selected="false">Drivers</a>
          <a href="{{ request.host_url }}config/app/{{ addon_slug }}/logs" class="nav-link" id="nav-logs-link" role="tab" aria-controls="nav-driver" aria-selected="false">Logs</a>
          <script>
            document.getElementById('nav-logs-link').addEventListener('click', function (e) {
              e.preventDefault();
              window.top.location.assign(this.href);
            });
          </script>
        </div>
      </nav>
      <h1 class="mb-3">wmbusmeters HA addon configuration</h1>
      <form id="json-form" method="POST">
        <div class="input-group">
          <span class="input-group-text" id="basic">wmbusmeters config location</span>
          <span class="input-group-text">=</span>
          <input type="text" class="form-control" id="file-path" name="file_path" required>
        </div>
        <br />
        <div id="json-editor">
          <h4 class="mb-3">wmbusmeters configuration</h4>
          <div id="conf"></div>
          <button id="add-pair" class="btn btn-outline-success" type="button">Add New parameter</button>
          <hr class="my-4">
          <h4 class="mb-3">MQTT section</h4>
          <div class="input-group mb-3 mt-3" style="max-width: 36rem">
            <span class="mqtt-label input-group-text" id="basic">MQTT discovery (default for all meters)</span>
            <select class="form-select" id="mqtt-discovery" name="mqtt-discovery">
              <option value="disable">Disable</option>
              <option value="auto">Automatic</option>
              <option value="manual">Manual (applied in the panel for every meter)</option>
            </select>
          </div>
          <div class="input-group mb-3 mt-3">
            <span class="mqtt-label input-group-text" id="basic">Custom MQTT configuration</span>
            <div class="input-group-text">
              <input class="form-check-input mt-0" type="checkbox" id="mqtt-enabled" name="mqtt_enabled">
            </div>
          </div>
          <div id="mqtt"></div>
          <hr class="my-4">
          <h4 class="mb-3">Meters</h4>
          <div id="sections"></div>
          <button id="add-section" class="btn btn-outline-primary" type="button">Add New meter</button>
        </div>
        <br>
        <hr class="my-4">
        <button id="save-json" name="save_json" class="btn btn-outline-success" type="submit">Save Changes</button>
        <hr class="my-4">
      </form>
    </div>
  </body>
</html>
