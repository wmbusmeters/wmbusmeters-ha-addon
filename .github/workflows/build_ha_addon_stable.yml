name: Build HA addon stable

on:
  repository_dispatch:
    types: [build_ha_stable]

concurrency:
  group: ha-addon-build
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.HA_PAT }}'

      - name: Update README and set version in config.json
        env:
          RAW_VER: ${{ github.event.client_payload.ver }}
        run: |
          VER="$RAW_VER"
          S=wmbusmeters-ha-addon
          # Stable is a copy of edge, but keeps its own changelog and breaking change
          # announcements: its pending BREAKING.md, its NOTICE.md and its breaking_versions.
          STABLE_BREAKING_VERSIONS=$(grep -m 1 '"breaking_versions"' $S/config.json || true)
          rsync -a --delete wmbusmeters-ha-addon-edge/ $S/ --exclude CHANGELOG.md --exclude BREAKING.md --exclude NOTICE.md
          sed -i 's/\[edge\] //g; s/-edge//g' $S/config.json
          sed -i '/"breaking_versions"/d' $S/config.json
          sed -i "s|\s\{4,\}\"version\".*|    \"version\": \"$VER\"\,|g" $S/config.json
          if [ -n "$STABLE_BREAKING_VERSIONS" ]; then
            sed -i "s|^\(\s\{4,\}\)\"version\": \"$VER\",|&\n$STABLE_BREAKING_VERSIONS|" $S/config.json
          fi
          sed -i "1s|^|## $VER \n- Updated to version [$VER](https://github.com/wmbusmeters/wmbusmeters/blob/master/CHANGES)\n|" $S/CHANGELOG.md
          # A pending BREAKING.md announces a breaking change with this version, as in the
          # edge build: it is added to the changelog entry (HA shows it in the update dialog),
          # the version goes into breaking_versions (HA then requires a manual update, even
          # with auto-update on) and it becomes NOTICE.md, which the add-on shows once as a
          # persistent notification after the update.
          BREAKING=$S/BREAKING.md
          if [ -s "$BREAKING" ]; then
            CHANGELOG=$S/CHANGELOG.md
            { head -n 2 "$CHANGELOG"; echo "- **Breaking change:**"; sed 's/^/  /' "$BREAKING"; tail -n +3 "$CHANGELOG"; } > "$CHANGELOG.new"
            mv "$CHANGELOG.new" "$CHANGELOG"
            CONFIG=$S/config.json
            if grep -q '"breaking_versions"' "$CONFIG"; then
              sed -i "s|\"breaking_versions\": \[|\"breaking_versions\": [\"$VER\", |" "$CONFIG"
            else
              sed -i "s|^\(\s\{4,\}\)\"version\": \"$VER\",|&\n\1\"breaking_versions\": [\"$VER\"],|" "$CONFIG"
            fi
            { echo "$VER"; cat "$BREAKING"; } > $S/NOTICE.md
            rm "$BREAKING"
          fi
          # The Dockerfile copies NOTICE.md, empty when stable never had a breaking change.
          touch $S/NOTICE.md

      - uses: actions/upload-artifact@v7
        with:
          name: ha-addon_artifact-${{ github.run_id }}
          path: ${{ github.workspace }}
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ["wmbusmeters"]
        arch: ["amd64", "aarch64"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ha-addon_artifact-${{ github.run_id }}

      - name: Login to DockerHub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build ${{ matrix.addon }} ${{ matrix.arch }} HA add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target wmbusmeters-ha-addon \
            --version ${{ github.event.client_payload.ver }}

  update-repo:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.HA_PAT }}'

      - uses: actions/download-artifact@v8
        with:
          name: ha-addon_artifact-${{ github.run_id }}

      - name: Remove the BREAKING.md announced by this build
        # download-artifact only adds and overwrites files: the BREAKING.md consumed by the
        # prepare job would stay in the repository and be announced again by the next release.
        run: |
          S=wmbusmeters-ha-addon
          if [ -f "$S/BREAKING.md" ] && [ "$(head -n 1 "$S/NOTICE.md" 2>/dev/null)" = "${{ github.event.client_payload.ver }}" ]; then
            rm "$S/BREAKING.md"
          fi

      - name: Wait before repository update
        run: sleep 120

      - run: git pull
      - name: Push changed files back to repo
        uses: EndBug/add-and-commit@v11
        with:
          default_author: github_actions
          message: "Auto Push - update ha-addon config and changelog for ${{ github.event.client_payload.ver }} - [no ci]"
          pull: '--rebase --autostash'
