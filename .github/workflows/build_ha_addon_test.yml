name: Build HA addon test

on:
  repository_dispatch:
    types: [build_ha_test]

concurrency:
  group: ha-addon-build-test
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.HA_PAT }}'

      - name: Update README and set version in config.json
        id: version
        env:
          RAW_VER: ${{ github.event.client_payload.ver }}
        run: |
          # AwesomeVersion cannot order versions like "3.0.0-135" (issue #2076, numeric
          # prerelease identifiers); normalize to dotted "3.0.0.135", which orders
          # correctly and is greater than any installed "3.0.0-N" or "3.0.0-N-k".
          VER="$(echo "$RAW_VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$/\1.\2/')"
          echo "version=$VER" >> $GITHUB_OUTPUT
          sed -i "s|\s\{4,\}\"version\".*|    \"version\": \"$VER\"\,|g" wmbusmeters-ha-addon-test/config.json
          sed -i "1s|^|## $VER \n- Updated to version [$VER](https://github.com/wmbusmeters/wmbusmeters/commits/master)\n|" wmbusmeters-ha-addon-test/CHANGELOG.md

      - uses: actions/upload-artifact@v7
        with:
          name: ha-addon_artifact-${{ github.event.client_payload.ver }}
          path: ${{ github.workspace }}
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ["wmbusmeters"]
        arch: ["amd64", "aarch64"]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ha-addon_artifact-${{ github.event.client_payload.ver }}

      - name: Login to DockerHub
        uses: docker/login-action@v4.5.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Build ${{ matrix.addon }} ${{ matrix.arch }} HA add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target wmbusmeters-ha-addon-test \
            --version ${{ needs.prepare.outputs.version }}

  update-repo:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: '${{ secrets.HA_PAT }}'

      - uses: actions/download-artifact@v8
        with:
          name: ha-addon_artifact-${{ github.event.client_payload.ver }}

      - name: Push changed files back to repo
        uses: EndBug/add-and-commit@v11
        with:
          default_author: github_actions
          message: "Auto Push - update ha-addon config and changelog for ${{ github.event.client_payload.ver }} - [no ci]"
