name: Build HA add-ons on push

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'wmbusmeters-ha-addon/**'
      - '.github/workflows/build_ha_addon_stable.yml'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did the [test] add-on change?
        id: changed
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q -e '^wmbusmeters-ha-addon-test/' -e '^.github/workflows/build_ha_addon_test.yml'; then
            echo "test=true" >> $GITHUB_OUTPUT
          fi

      # The builds run in the same workflows as for a wmbusmeters commit, so the version
      # numbering and the BREAKING.md announcement are handled in one place.
      - name: Build edge
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HA_PAT }}
          event-type: build_ha_edge
          client-payload: '{"ver": ""}'

      - name: Build test
        if: steps.changed.outputs.test == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.HA_PAT }}
          event-type: build_ha_test
          client-payload: '{"ver": ""}'
